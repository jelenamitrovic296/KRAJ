<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пријава - Академски менторски систем</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>Систем за приказ менторских и докторских односа</h1>
            <p class="subtitle">Математички факултет Универзитета у Београду</p>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <div class="info-content">
                <div class="info-title">Добродошли!</div>
                <div class="info-text">
                    Пријавите се као администратор да бисте имали пуна права за уређивање података.
                </div>
            </div>
        </div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Корисничко име
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Унесите корисничко име" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Лозинка
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Унесите лозинку" required>
                </div>
            </div>

            <button type="submit">
                <i class="fas fa-sign-in-alt"></i>
                Пријави се
            </button>
        </form>

        <div id="errorMsg" class="error-msg"></div>

        <div style="text-align:center; margin-top: 20px;">
            <a href="/student-graph/" style="color:#64748b; font-size:14px; text-decoration:underline;">
                Назад на приказ (гост приступ)
            </a>
        </div>
    
        </div>
    </div>

    <script>
    
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
            const response = await fetch('/login/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            
            const data = await response.json();
            
            if (data.success) {
              
                window.location.href = '/student-graph/';
            } else {
                document.getElementById('errorMsg').textContent = data.message;
                document.getElementById('errorMsg').style.display = 'block';
            }
        } catch (error) {
            console.error('Грешка:', error);
            document.getElementById('errorMsg').textContent = 'Грешка при повезивању са сервером';
            document.getElementById('errorMsg').style.display = 'block';
        }
    });
    </script>
</body>
</html>
