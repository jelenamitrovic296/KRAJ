{# partials/_forma_profesora.html #}
<div id="profesorska-forma" class="card-mb-4" style="display:none;">
  <div class="card-header"><h5 class="mb-0">Форма за претрагу професора</h5></div>
  <div class="card-body">
    <form method="get">
      <div class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" name="ime_profesora" class="form-control" placeholder="Име" value="{{ request.GET.ime_profesora }}">
        </div>
        <div class="col-md-4">
          <input type="text" name="prezime_profesora" class="form-control" placeholder="Презиме" value="{{ request.GET.prezime_profesora }}">
        </div>
        <div class="col-md-2">
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" name="mentorstvo" value="1" id="chkMentor" {% if request.GET.mentorstvo %}checked{% endif %}>
            <label class="form-check-label" for="chkMentor">Ментор</label>
          </div>
        </div>
        <div class="col-md-2">
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" name="clan_komisije" value="1" id="chkKomisija" {% if request.GET.clan_komisije %}checked{% endif %}>
            <label class="form-check-label" for="chkKomisija">Члан комисије</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Прикажи податке</button>
      <button type="submit" name="statistika" value="1" class="btn btn-secondary ms-2">Прикажи статистику</button>
    </form>

    <hr>
    <form method="get">
      <div class="row g-2">
        <div class="col-md-6">
          <input type="text" name="naziv_institucije" class="form-control" placeholder="Институција" value="{{ request.GET.naziv_institucije }}">
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-outline-primary w-100">Прикажи професоре са институције</button>
        </div>
      </div>
    </form>
  </div>
</div>
